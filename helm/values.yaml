replicaCount: 1

image:
  repository: ghcr.io/agologan/teams-relay
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config: {}
  # bot:
  #   tenantId: 00000000-0000-0000-0000-000000000000
