name: Build

on:
  push:
    branches:
      - main
    paths:
      - "**.ts"
      - package.json
      - pnpm-lock.yaml
      - Dockerfile
      - .github/workflows/build.yaml

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Submit dependency SBOM to GitHub Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: true
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          format: github
          output: dependency-results.sbom.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif

      - name: Map image findings to Dockerfile preview
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "trivy-results.sarif";
          const sarif = JSON.parse(fs.readFileSync(file, "utf8"));

          for (const run of sarif.runs ?? []) {
            for (const result of run.results ?? []) {
              const locations = result.locations ?? [];
              const locationDetails = locations
                .map((location) =>
                  location.message?.text ??
                  location.physicalLocation?.artifactLocation?.uri,
                )
                .filter(Boolean);

              if (result.message?.text && locationDetails.length > 0) {
                result.message.text = `${locationDetails.join("\n")}\n${result.message.text}`;
              }

              for (const location of locations) {
                const physicalLocation = location.physicalLocation;
                if (!physicalLocation?.artifactLocation) continue;

                physicalLocation.artifactLocation.uri = "Dockerfile";
                physicalLocation.region = { startLine: 1 };
              }
            }
          }

          fs.writeFileSync(file, `${JSON.stringify(sarif, null, 2)}\n`);
          NODE

      - name: Upload scan results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
